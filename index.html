<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio da semana</title>
<meta name="theme-color" content="#EEF3EA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EA; --surface:#FFFFFF; --ink:#1C2A22; --muted:#5A6A5F; --line:#D3DDCD;
  --leaf:#2E7D4F; --tomato:#D4432A; --yolk:#E9A51F; --oat:#A87A3C; --berry:#BE3D67;
  --paper:#FFFCEF; --rule:#E7DFC2;
  --head:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Kalam", "Comic Sans MS", "Segoe Print", cursive;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111915; --surface:#19241D; --ink:#E5EDE6; --muted:#9DB0A3; --line:#2B3A31;
    --leaf:#62C189; --tomato:#F06B51; --yolk:#F2C153; --oat:#D2A86C; --berry:#EC7FA2;
    --paper:#1E2921; --rule:#2F3D33; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111915; --surface:#19241D; --ink:#E5EDE6; --muted:#9DB0A3; --line:#2B3A31;
  --leaf:#62C189; --tomato:#F06B51; --yolk:#F2C153; --oat:#D2A86C; --berry:#EC7FA2;
  --paper:#1E2921; --rule:#2F3D33; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--leaf)}
:focus-visible{outline:3px solid var(--yolk);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 120px}

/* header */
.top{display:flex;align-items:center;gap:10px;margin:4px 0 2px}
.top h1{font:800 clamp(1.7rem,6.4vw,2.5rem)/1.05 var(--head);letter-spacing:-.02em;margin:0;flex:1}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
.sub{color:var(--muted);margin:6px 0 18px;font-size:.95rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--tomato);color:#fff;display:inline-flex;gap:8px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn svg{width:16px;height:16px}

/* start here */
.start{border-left:4px solid var(--yolk);padding:4px 0 4px 16px;margin:0 0 30px}
.start h2{font:700 1.15rem/1.2 var(--head);margin:0 0 10px}
.start ol{margin:0;padding-left:1.2em}
.start li{margin:0 0 8px}
.start li b{font-weight:600}
.shared{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{font-size:.82rem;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--leaf) 14%,var(--surface));color:var(--ink)}

/* meals */
.meal{margin:0 0 28px}
.meal h2{font:700 1.25rem/1.2 var(--head);margin:0;display:flex;align-items:center;gap:10px}
.meal h2::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--cat)}
.meal .hint{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.dish{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 8px;margin-bottom:8px}
.dish.locked{border-color:var(--cat);box-shadow:inset 3px 0 0 var(--cat)}
.dish-open{flex:1;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;cursor:pointer;padding:4px;min-width:0}
.tile{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;flex:none;background:color-mix(in srgb,var(--cat) 20%,var(--surface))}
.dish-name{display:block;font:700 1.02rem/1.25 var(--head)}
.dish-meta{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}
.dish-also{display:block;font-size:.8rem;margin-top:3px;color:var(--leaf);font-weight:600}
.act{display:flex;flex-direction:column;gap:4px}
.act button{border:0;background:none;width:36px;height:34px;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.act button:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.act button[aria-pressed="true"]{color:var(--cat)}
.act svg{width:18px;height:18px}
.c-almoco{--cat:var(--leaf)} .c-lanche{--cat:var(--yolk)} .c-cafe{--cat:var(--oat)} .c-doce{--cat:var(--berry)}

/* shopping note: the one bold thing */
.note{background:var(--paper);border-radius:6px 6px 22px 6px;padding:22px 18px 26px 18px;box-shadow:0 1px 0 var(--rule),0 14px 30px -18px color-mix(in srgb,var(--ink) 45%,transparent);position:relative}
.note h1{font:700 2rem/1.1 var(--hand);margin:0 0 4px;color:var(--tomato)}
.note .prog{font-family:var(--hand);color:var(--muted);margin:0 0 14px}
.bar{height:6px;border-radius:6px;background:var(--rule);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.note h3{font:700 1rem/1.2 var(--body);margin:20px 0 4px;color:var(--muted)}
.note ul{list-style:none;margin:0;padding:0}
.note li{border-bottom:1px solid var(--rule)}
.note label{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;cursor:pointer}
.note input{appearance:none;-webkit-appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;margin:3px 0 0;flex:none;display:grid;place-items:center;cursor:pointer}
.note input:checked{background:var(--leaf);border-color:var(--leaf)}
.note input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.item{font:400 1.2rem/1.3 var(--hand)}
.item b{font-weight:700}
.qty{color:var(--tomato);font-weight:700;white-space:nowrap}
.uses{display:block;font:400 .78rem/1.35 var(--body);color:var(--muted);margin-top:1px}
.note input:checked + span .item{text-decoration:line-through;text-decoration-thickness:2px;opacity:.5}
details.pantry summary{cursor:pointer;font-weight:700;color:var(--muted);margin-top:22px}
.listtools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}

/* library */
.search{width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:4px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.libcount{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.extras{margin-top:34px}
.extras h2{font:700 1.2rem/1.2 var(--head);margin:0 0 4px}
.extras p{color:var(--muted);margin:0 0 10px;font-size:.92rem}
.extras ul{margin:0;padding:0;list-style:none}
.extras li{padding:9px 0;border-bottom:1px solid var(--line)}
.extras a{text-decoration:none;color:var(--ink);font-weight:600}
.extras small{color:var(--muted);display:block}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--tomato)}

/* recipe sheet */
dialog{border:0;padding:0;width:min(680px,100%);max-width:100%;max-height:100%;height:100%;margin:0 auto;background:var(--bg);color:var(--ink);overflow-y:auto}
@media (min-width:700px){dialog{height:auto;max-height:92vh;margin:4vh auto;border-radius:22px}}
dialog::backdrop{background:rgba(10,20,14,.55)}
.sheet{padding:calc(env(safe-area-inset-top,0px) + 14px) 20px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sheet-top{display:flex;justify-content:flex-end;position:sticky;top:0}
.sheet .tile{width:68px;height:68px;font-size:2.3rem;border-radius:18px}
.sheet h2{font:800 1.7rem/1.1 var(--head);letter-spacing:-.01em;margin:12px 0 6px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font-size:.88rem}
.fact b{display:block;font:700 1rem/1.2 var(--head)}
.by{color:var(--muted);font-size:.9rem;margin:8px 0 14px}
.video{margin:6px 0 18px}
.video iframe{display:block;width:min(100%,330px);aspect-ratio:9/16;max-height:72vh;border:0;border-radius:16px;margin:12px auto 0;background:#000}
.sheet h3{font:700 1.15rem/1.2 var(--head);margin:22px 0 8px}
.ings{margin:0;padding:0;list-style:none}
.ings li{padding:7px 0;border-bottom:1px dashed var(--line)}
.steps{margin:0;padding-left:1.4em}
.steps li{margin:0 0 12px;padding-left:4px;max-width:65ch}
.steps li::marker{font:700 1rem var(--head);color:var(--tomato)}
.obs{background:color-mix(in srgb,var(--yolk) 16%,var(--surface));border-radius:12px;padding:10px 14px;font-size:.9rem;margin-top:16px}
.tip{border-left:3px solid var(--leaf);padding:4px 0 4px 12px;margin-top:16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.on{opacity:1}
[hidden]{display:none!important}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:.72rem;font-weight:600;line-height:1.5;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ink) 8%,var(--surface));color:var(--muted)}
.tag.t-fr,.tag.t-ca,.tag.t-po,.tag.t-at,.tag.t-ov{background:color-mix(in srgb,var(--tomato) 16%,var(--surface));color:var(--ink)}
.tag.t-ve,.tag.t-sa{background:color-mix(in srgb,var(--leaf) 18%,var(--surface));color:var(--ink)}
.sheet .tags{margin:12px 0 0}
.mix{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;color:var(--muted)}
.mix input{accent-color:var(--tomato);width:120px}
.protbox{flex-basis:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.pb-head{font:700 1rem/1.2 var(--head);margin:0 0 8px}
.protbox .chips{flex-wrap:wrap;overflow:visible;margin:0 0 10px;padding:0}
.protbox .chips small{font-weight:500;opacity:.6;margin-left:2px}
.pb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pb-label{font-size:.85rem;font-weight:600;color:var(--muted)}
.pb-sum{margin:10px 0 0;font-size:.9rem;color:var(--muted)}
.pb-sum.dirty{color:var(--ink);font-weight:600}
.pb-note{background:color-mix(in srgb,var(--yolk) 16%,var(--surface));border-radius:12px;padding:10px 14px;font-size:.9rem;margin:0 0 22px}
.tagchips button{font-size:.82rem;padding:5px 12px}
.tile{position:relative;overflow:hidden}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sheet .tile.hero{width:150px;height:200px;border-radius:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <section id="v-semana" aria-labelledby="t-semana"></section>
  <section id="v-compras" hidden></section>
  <section id="v-receitas" hidden></section>
</main>

<nav class="tabs" aria-label="Seções">

  </div>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* As receitas ficam em receitas.json */
let K = {};
const SECTIONS = [["horti","Hortifrúti"],["carnes","Carnes e ovos"],["frios","Laticínios e frios"],["merc","Mercearia"]];

let R = [], EXTRAS = [], BY = {};

const CAT = {
  almoco:{s:"Almoço",pl:"Almoços",hint:"Rendem marmitas: dá pra fazer tudo num dia de preparo."},
  lanche:{s:"Lanche ou jantar",pl:"Lanches e jantares",hint:"Mais rápidos, bons pra noite."},
  cafe:{s:"Café ou lanche da tarde",pl:"Café da manhã e lanche da tarde",hint:"Vários dá pra deixar prontos na geladeira."},
  doce:{s:"Doce",pl:"Doce da semana",hint:"Pra quando bater vontade."}
};
const DIF = {1:"fácil",2:"médio"};
const SKIP_SCORE = new Set(["cebola","alho"]);

const TAGL = {fr:"Frango",ca:"Carne",po:"Porco",at:"Atum",ov:"Ovos",ve:"Vegetariano",or:"Oriental",it:"Italiano",me:"Mediterrâneo",am:"Americano",sa:"Saudável",pr:"Proteico",ri:"Rápido",lc:"Low carb",ss:"Sem açúcar",ma:"Marmita",cg:"Congela bem",af:"Air fryer"};
const TAG_ORDER = Object.keys(TAGL);
const PROT = ["fr","ca","po","at","ov"];
/* ingredientes que estragam rápido depois de abertos valem mais quando se repetem */
const W = {iogurte:2,requeijao:2,ricota:2,cremecheese:2,cremeleite:2,cheddar:1.6,massapastel:1.6,espinafre:1.6,alface:1.6,tortilha:1.5,pao:1.5,milho:1.5,morango:1.5,abobora:1.5,repolho:1.5,leite:1.4,tomatecereja:1.3,mussarela:1.3,brocolis:1.3,pepino:1.3,mandioquinha:1.3,cebolinha:1.3,salsinha:1.2};
/* 0 = máxima economia ... 4 = máxima variedade */
const MIX = [
 {econ:1.4, nw:0.45, rnd:1.0, kind:0.8, cap:{fr:4,_:3}},
 {econ:1.15,nw:0.35, rnd:1.3, kind:1.2, cap:{fr:3,_:2}},
 {econ:0.9, nw:0.25, rnd:1.7, kind:1.6, cap:{fr:3,_:2}},
 {econ:0.6, nw:0.15, rnd:2.2, kind:2.2, cap:{fr:2,_:2}},
 {econ:0.3, nw:0.05, rnd:2.8, kind:3.0, cap:{fr:2,_:1}}
];
const MIX_LABEL = ["Máxima economia","Mais economia","Equilibrado","Mais variedade","Máxima variedade"];
function tagChips(r,n){ const t=r.tags.slice(0,n||99); return t.length ? `<span class="tags">${t.map(x=>`<span class="tag t-${x}">${TAGL[x]}</span>`).join("")}</span>` : ""; }

/* ============ LÓGICA ============ */
function parseIng(str){
  const idx = str.indexOf(":");
  const left = idx>=0 ? str.slice(0,idx) : str;
  const txt = idx>=0 ? str.slice(idx+1).trim() : null;
  const [key, amt] = left.trim().split(/\s+/);
  let q=null,u=null;
  if(amt){ const m = amt.match(/^([\d.]+)(g|ml|un)$/); if(m){ q=+m[1]; u=m[2]; } }
  return {key,q,u,txt};
}
function prepare(){
  R.forEach(r=>{
    r.ings = r.i.map(parseIng);
    r.keys = [...new Set(r.ings.map(x=>x.key).filter(k=>K[k] && K[k][1]!=="desp" && !SKIP_SCORE.has(k)))];
    r.kind = r.tipo || "";
    r.tags = (r.tags||"").split(" ").filter(Boolean);
    if(r.t<=15) r.tags.push("ri");
    if(!r.ings.some(x=>(K[x.key] && K[x.key][1]==="carnes" && x.key!=="ovo") || ["atum","caldo","gelatina","gelatinazero"].includes(x.key))) r.tags.push("ve");
    r.tags=TAG_ORDER.filter(t=>r.tags.includes(t));
    r.prot=PROT.find(p=>r.tags.includes(p))||null;
    r.vid = r.vid || r.id;
  });
  BY = Object.fromEntries(R.map(r=>[r.id,r]));
}
function ingText(x){
  if(x.txt) return x.txt;
  const nm = K[x.key] ? K[x.key][0] : x.key;
  if(x.q==null) return nm + " a gosto";
  return x.u==="un" ? `${x.q} ${nm.toLowerCase()}` : `${fmtQ(x.q,x.u)} de ${nm.toLowerCase()}`;
}
function fmtNum(n){ return (Math.round(n*10)/10).toString().replace(".",","); }
function fmtQ(q,u){
  if(u==="g") return q>=1000 ? fmtNum(q/1000)+" kg" : Math.round(q)+" g";
  if(u==="ml") return q>=1000 ? fmtNum(q/1000)+" L" : Math.round(q)+" ml";
  return fmtNum(q)+" un";
}
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

const STORE_KEY="cardapio-v1";
function load(){ try{ const v=localStorage.getItem(STORE_KEY); if(v) return JSON.parse(v); }catch(e){} return null; }
let S = load() || {weeks:{}, checks:{}, nAlmoco:2};
if(S.mix==null) S.mix=2;
if(!Array.isArray(S.protSel)) S.protSel=[]; if(S.protN==null) S.protN=0;
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }

function mondayOf(offset){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7); return d; }
function keyOf(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function weekLabel(mon){ const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return mon.getMonth()===sun.getMonth() ? `${mon.getDate()} a ${sun.getDate()} de ${MESES[sun.getMonth()]}` : `${mon.getDate()} de ${MESES[mon.getMonth()]} a ${sun.getDate()} de ${MESES[sun.getMonth()]}`; }
function quota(){ return {almoco:S.nAlmoco, lanche:3, cafe:2, doce:1}; }

function mixCfg(){ return MIX[S.mix==null?2:S.mix]; }
function ctxOf(plan, exceptId){
  const ctx={keys:new Set(), prot:{}, kinds:new Set(), catKinds:new Set(), lunchProts:[]};
  Object.entries(plan).forEach(([c,ids])=>ids.forEach(id=>{ if(id===exceptId || !BY[id]) return; const r=BY[id];
    r.keys.forEach(k=>ctx.keys.add(k));
    if(r.prot) ctx.prot[r.prot]=(ctx.prot[r.prot]||0)+1;
    if(r.kind){ ctx.kinds.add(r.kind); ctx.catKinds.add(c+":"+r.kind); }
    if(c==="almoco") ctx.lunchProts.push(r.prot); }));
  return ctx;
}
function scoreOf(r, ctx, rnd, recent){
  const m=mixCfg(); let sh=0, nw=0;
  r.keys.forEach(k=>{ if(ctx.keys.has(k)) sh+=W[k]||1; else nw++; });
  const base = ctx.keys.size ? sh*m.econ - nw*m.nw : 0;
  const kindPen = r.kind && ctx.kinds.has(r.kind) ? m.kind : 0;
  return base + rnd()*m.rnd - kindPen - (recent.has(r.id)?1.5:0);
}
const CATS=["almoco","lanche","cafe","doce"];
const MAIN=new Set(["almoco","lanche"]);
function listPt(a){ return a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+" e "+a[a.length-1]; }
function protCfg(){ return {sel:(S.protSel||[]).filter(p=>PROT.includes(p)), n:S.protN||0}; }
function sameCfg(a,b){ a=a||{sel:[],n:0}; b=b||{sel:[],n:0}; return a.n===b.n && a.sel.join()===b.sel.join(); }
function protCount(p){ return R.filter(r=>r.prot===p && MAIN.has(r.c)).length; }
/* proteínas permitidas na semana (null = sem restrição) */
function weekProts(cfg, rnd){
  if(!cfg.n) return null;
  const k=Math.max(cfg.n, cfg.sel.length), P=cfg.sel.slice();
  const avail=PROT.filter(p=>!P.includes(p) && protCount(p)>0);
  const q=quota(), fits=S2=>["almoco","lanche"].every(c=>R.filter(r=>r.c===c && (!r.prot || S2.includes(r.prot))).length>=q[c]);
  while(P.length<k && avail.length){
    /* na última escolha, prefere proteínas que fecham a semana inteira */
    let opts=avail.slice();
    if(P.length===k-1){ const ok=opts.filter(p=>fits([...P,p])); if(ok.length) opts=ok; }
    const w=opts.map(p=>Math.sqrt(protCount(p))); let x=rnd()*w.reduce((a,b)=>a+b,0), i=0;
    while(i<w.length-1 && x>w[i]){ x-=w[i]; i++; }
    P.push(opts[i]); avail.splice(avail.indexOf(opts[i]),1);
  }
  return P;
}
function protSummary(cfg){
  const L=cfg.sel.map(p=>TAGL[p].toLowerCase()), list=listPt(L);
  if(!cfg.n) return L.length ? `Qualquer proteína, com pelo menos uma receita de ${list}.` : "Qualquer proteína: o sorteio varia sozinho.";
  const k=Math.max(cfg.n,L.length), extra=k-L.length;
  if(!L.length) return `${k} proteína${k>1?"s":""} na semana, escolhida${k>1?"s":""} pelo sorteio.`;
  if(!extra) return `Só ${list} nos almoços e lanches.`;
  return `${list.charAt(0).toUpperCase()+list.slice(1)} e mais ${extra} proteína${extra>1?"s":""} que o sorteio escolhe.`;
}
function protBox(w){
  const cfg=protCfg(), dirty=!sameCfg(cfg, w.cfg);
  return `<div class="protbox"><div class="pb-head">Proteínas da semana</div>
    <div class="chips" role="group" aria-label="Escolher proteínas">${PROT.map(p=>`<button data-act="prot" data-p="${p}" aria-pressed="${cfg.sel.includes(p)}" aria-label="${TAGL[p]}, ${protCount(p)} receitas">${TAGL[p]} <small>${protCount(p)}</small></button>`).join("")}</div>
    <div class="pb-row"><span class="pb-label">Quantas:</span><div class="seg" role="group" aria-label="Quantas proteínas na semana">${[[0,"Qualquer"],[1,"1"],[2,"2"],[3,"3"]].map(([n,l])=>`<button data-act="protn" data-n="${n}" aria-pressed="${cfg.n===n}">${l}</button>`).join("")}</div></div>
    <p class="pb-sum${dirty?" dirty":""}">${protSummary(cfg)}${dirty?" Toque em “Sortear outro cardápio” pra aplicar.":""}</p></div>`;
}
function allowed(r, ctx, lastLunch, P){
  const m=mixCfg();
  if(P && MAIN.has(r.c) && r.prot && !P.includes(r.prot)) return false;
  if(r.prot && !(P && P.includes(r.prot))){ const cap = r.prot in m.cap ? m.cap[r.prot] : m.cap._; if((ctx.prot[r.prot]||0) >= cap) return false; }
  if(S.mix>0 && r.kind && ctx.catKinds.has(r.c+":"+r.kind)) return false;
  if(!P && lastLunch && r.prot==="fr" && ctx.lunchProts.length && ctx.lunchProts.every(p=>p==="fr")) return false;
  return true;
}
function pickBest(c, plan, rnd, recent, opts){
  opts=opts||{}; const ctx=ctxOf(plan, opts.except), P=opts.P||null;
  const used=new Set(Object.values(plan).flat()); if(opts.except) used.add(opts.except);
  let cands=R.filter(r=>r.c===c && !used.has(r.id));
  if(opts.only) cands=cands.filter(r=>r.prot===opts.only);
  if(!cands.length) return null;
  let pool=cands.filter(r=>allowed(r,ctx,opts.lastLunch,P));
  if(!pool.length && P && MAIN.has(c)) pool=cands.filter(r=>!r.prot || P.includes(r.prot));
  if(!pool.length){ pool=cands; if(P && MAIN.has(c) && opts.notes) opts.notes.add(c); }
  let best=null, bs=-1e9; pool.forEach(r=>{ const sc=scoreOf(r,ctx,rnd,recent); if(sc>bs){bs=sc;best=r;} });
  return best;
}
function recentOf(wk){ const d=new Date(wk+"T12:00:00"); d.setDate(d.getDate()-7); const p=S.weeks[keyOf(d)]; return new Set(p ? Object.values(p.plan).flat() : []); }

function generate(wk, seedN, keepLocked){
  const rnd = rng(hash(wk+"|"+seedN+"|"+S.mix));
  const recent = recentOf(wk);
  const old = S.weeks[wk];
  const locked = keepLocked && old ? old.locked.filter(id=>BY[id]) : [];
  const plan = {almoco:[],lanche:[],cafe:[],doce:[]};
  const q = quota(), cfg = protCfg(), P = weekProts(cfg, rnd), notes = new Set(), missing = [];
  locked.forEach(id=>{ const c=BY[id].c; if(plan[c].length<q[c]) plan[c].push(id); });
  /* garante pelo menos uma receita de cada proteína escolhida */
  const lanchesDe=p=>R.filter(r=>r.c==="lanche" && r.prot===p).length;
  const must=(P || cfg.sel).slice().sort((a,b)=>(lanchesDe(a)>0)-(lanchesDe(b)>0));
  for(const p of must){
    if(Object.entries(plan).some(([c,ids])=>MAIN.has(c) && ids.some(id=>BY[id].prot===p))) continue;
    let ok=false;
    const order = !lanchesDe(p) ? ["almoco"] : rnd()<0.5 ? ["almoco","lanche"] : ["lanche","almoco"];
    for(const c of order){
      if(plan[c].length>=q[c]) continue;
      const best=pickBest(c, plan, rnd, recent, {only:p, P});
      if(best){ plan[c].push(best.id); ok=true; break; }
    }
    if(!ok) missing.push(p);
  }
  for(const c of CATS){
    while(plan[c].length < q[c]){
      const best=pickBest(c, plan, rnd, recent, {P, notes, lastLunch: c==="almoco" && plan.almoco.length===q.almoco-1});
      if(!best) break;
      plan[c].push(best.id);
    }
  }
  const msgs=[];
  if(missing.length) msgs.push(`Não coube receita de ${listPt(missing.map(p=>TAGL[p].toLowerCase()))} nesta semana.`);
  if(notes.size) msgs.push(`Não há receitas suficientes de ${listPt(P.map(p=>TAGL[p].toLowerCase()))} para ${listPt([...notes].map(c=>CAT[c].pl.toLowerCase()))}, então completei com outras proteínas.`);
  S.weeks[wk] = {plan, locked: locked.filter(id=>Object.values(plan).flat().includes(id)), seed:seedN, cfg, P, notes:msgs};
  save();
}
function swap(wk, id){
  const w=S.weeks[wk]; const c=BY[id].c; const pos=w.plan[c].indexOf(id); if(pos<0) return;
  const P=w.P||null, must=P || (w.cfg && w.cfg.sel) || [], p=BY[id].prot;
  let best=null;
  if(p && MAIN.has(c) && must.includes(p) && !Object.entries(w.plan).some(([cc,ids])=>MAIN.has(cc) && ids.some(x=>x!==id && BY[x].prot===p)))
    best=pickBest(c, w.plan, Math.random, recentOf(wk), {except:id, only:p, P});
  if(!best) best=pickBest(c, w.plan, Math.random, recentOf(wk), {except:id, P, lastLunch: c==="almoco"});
  if(!best){ toast("Não há outra opção nessa categoria"); return; }
  w.plan[c][pos]=best.id; w.locked=w.locked.filter(x=>x!==id); save();
}
function ensureWeek(wk){
  const w=S.weeks[wk]; const q=quota();
  if(!w){ generate(wk,0,false); return; }
  const ok = Object.keys(q).every(c=> (w.plan[c]||[]).length===q[c] && w.plan[c].every(id=>BY[id]));
  if(!ok){ // número de almoços mudou: completa ou corta mantendo o que já existe
    const keep = (w.locked||[]).slice();
    Object.keys(q).forEach(c=>{ w.plan[c]=(w.plan[c]||[]).filter(id=>BY[id]).slice(0,q[c]); });
    w.locked = Object.values(w.plan).flat();
    generate(wk, w.seed||0, true);
    const now = Object.values(S.weeks[wk].plan).flat();
    S.weeks[wk].locked = keep.filter(id=>now.includes(id));
    save();
  }
}

function shoppingFor(plan){
  const m=new Map();
  Object.values(plan).flat().forEach(id=>{ const r=BY[id]; if(!r) return;
    r.ings.forEach(x=>{ if(!K[x.key]) return;
      if(!m.has(x.key)) m.set(x.key,{key:x.key,amt:{},vague:false,recipes:new Set()});
      const e=m.get(x.key); e.recipes.add(r.n);
      if(x.q!=null) e.amt[x.u]=(e.amt[x.u]||0)+x.q; else e.vague=true;
    });
  });
  return [...m.values()];
}
function amtText(e){
  const parts=Object.entries(e.amt).map(([u,q])=>fmtQ(q,u));
  if(!parts.length) return "";
  return parts.join(" + ") + (e.vague?" +":"");
}

    ${r.a?`<p class="obs">A legenda não trazia o passo a passo completo, então resumi a partir dela. Vale dar uma olhada no vídeo pra conferir os detalhes.</p>`:""}`;
  const d=$("#sheet"); if(!d.open) d.showModal(); d.scrollTop=0;
}

function cover(r){ return `<img src="img/${r.vid}.jpg" alt="" loading="lazy" onerror="this.remove()">`; }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }

function show(){
  const v=(location.hash||"#semana").slice(1);
  const view=["semana","compras","receitas"].includes(v)?v:"semana";
  ["semana","compras","receitas"].forEach(x=>$("#v-"+x).hidden = x!==view);
  document.querySelectorAll("nav.tabs a").forEach(a=>{ if(a.dataset.v===view) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(view==="semana") renderWeek(); else if(view==="compras") renderShop(); else renderLib();
}

document.addEventListener("click",e=>{
  const op=e.target.closest("[data-open]"); if(op){ openRecipe(op.dataset.open); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act; const {wk,w}=curWeek();
  if(a==="prevw"){ weekOffset--; renderWeek(); }
  else if(a==="nextw"){ weekOffset++; renderWeek(); }
  else if(a==="nalm"){ const n=+b.dataset.n; if(n!==S.nAlmoco){ S.nAlmoco=n; const keep=w.locked.slice(); w.locked=Object.values(w.plan).flat(); w.plan.almoco=w.plan.almoco.slice(0,n); generate(wk,w.seed||0,true); S.weeks[wk].locked=keep.filter(id=>Object.values(S.weeks[wk].plan).flat().includes(id)); save(); renderWeek(); } }
  else if(a==="reroll"){ generate(wk,(w.seed||0)+1,true); renderWeek(); toast("Cardápio novo! As fixadas ficaram."); }
  else if(a==="swap"){ swap(wk,b.dataset.id); renderWeek(); }
  else if(a==="lock"){ const id=b.dataset.id; w.locked = w.locked.includes(id) ? w.locked.filter(x=>x!==id) : [...w.locked,id]; save(); renderWeek(); }
  else if(a==="copy"){
    const list=shoppingFor(w.plan); const checks=S.checks[wk]||{};
    let txt="Lista do mercado ("+weekLabel(mondayOf(weekOffset))+")\n";
    SECTIONS.forEach(([sec,label])=>{ const its=list.filter(e=>K[e.key][1]===sec && !checks[e.key]); if(its.length) txt+="\n"+label+"\n"+its.map(e=>"- "+K[e.key][0]+(amtText(e)?" ("+amtText(e)+")":"")).join("\n")+"\n"; });
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Lista copiada")).catch(()=>{ prompt("Copie a lista:",txt); });
  }
  else if(a==="clearchecks"){ S.checks[wk]={}; save(); renderShop(); }
  else if(a==="prot"){ const p=b.dataset.p; S.protSel = S.protSel.includes(p) ? S.protSel.filter(x=>x!==p) : [...S.protSel,p]; if(S.protN && S.protSel.length>S.protN) S.protN=Math.min(3,S.protSel.length); save(); renderWeek(); }
  else if(a==="protn"){ S.protN=+b.dataset.n; if(S.protN && S.protSel.length>S.protN) S.protSel=S.protSel.slice(0,S.protN); save(); renderWeek(); }
  else if(a==="tag"){ libTag=b.dataset.t; renderLib(); }
  else if(a==="filter"){ libFilter=b.dataset.f; renderLib(); }
  else if(a==="close"){ $("#sheet").close(); }
  else if(a==="video"){ $("#vbox").innerHTML=`<iframe src="https://www.tiktok.com/player/v1/${b.dataset.vid}?music_info=0&description=0&rel=0" allow="fullscreen; encrypted-media; picture-in-picture" title="Vídeo da receita"></iframe>`; b.remove(); }
});
document.addEventListener("change",e=>{
  if(e.target.dataset.act==="mix"){ S.mix=+e.target.value; const {wk,w}=curWeek(); generate(wk,(w.seed||0)+1,true); renderWeek(); toast(MIX_LABEL[S.mix]+": cardápio novo, as fixadas ficaram."); return; }
  const c=e.target.closest("[data-check]"); if(!c) return;
  const {wk}=curWeek(); S.checks[wk]=S.checks[wk]||{}; S.checks[wk][c.dataset.check]=c.checked; save(); renderShop();
});
document.addEventListener("input",e=>{
  if(e.target.dataset.act==="search"){ libQuery=e.target.value; const pos=e.target.selectionStart; renderLib(); const s=$(".search"); s.focus(); s.setSelectionRange(pos,pos); }
});
$("#sheet").addEventListener("close",()=>{ $("#sheet-body").innerHTML=""; });
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("#sheet").close(); });
window.addEventListener("hashchange",()=>{ if(R.length){ show(); window.scrollTo(0,0); } });
fetch("receitas.json",{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ K=d.ingredientes; R=d.receitas; EXTRAS=d.extras||[]; prepare(); show(); })
  .catch(()=>{ $("#v-semana").innerHTML='<p class="sub">Não consegui carregar as receitas. Confira a internet e recarregue a página.</p>'; });
</script>
</body>
</html>
